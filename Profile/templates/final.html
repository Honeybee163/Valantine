{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            background-image: url("{% static 'pic7.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
        }

        .container {
            background: rgba(255, 220, 235, 0.66);
            padding: 50px 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-width: 550px;
            width: 90%;
            z-index: 2;
            border: 4px dotted white;
        }

        h1 {
            color: #b8325a;
            font-size: clamp(24px, 5.2vw, 38px);
            margin-bottom: 15px;
        }

        p {
            font-size: clamp(15px, 3.4vw, 20px);
            color: #7a2c45;
            margin-bottom: 12px;
        }

        /* 🎞️ GIF styling */
        .happy-gif {
            max-width: 100%;
            max-height: 240px;
            height: auto;
            display: block;
            margin: 0 auto 16px;
            border-radius: 20px;
            object-fit: contain;
        }

        form {
            margin-top: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid #ff9ec4;
            font-size: clamp(16px, 3.2vw, 18px);
            outline: none;
            margin-bottom: 20px;
        }

        input[type="text"]::placeholder {
            color: #c96a8d;
        }

        button {
            padding: 14px 45px;
            font-size: clamp(16px, 3.2vw, 20px);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            background: linear-gradient(to right, #ff6fae, #ff3d7f);
            box-shadow: 0 10px 25px rgba(255, 61, 127, 0.45);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        /* 🎊 Floating Happy Emojis */
        .emoji {
            position: absolute;
            bottom: -50px;
            font-size: 35px;
            animation: floatUp 6s linear infinite;
            opacity: 0.9;
            z-index: 1;
        }

        .emoji:nth-child(1) { left: 5%; animation-delay: 0s; }
        .emoji:nth-child(2) { left: 20%; animation-delay: 1s; }
        .emoji:nth-child(3) { left: 35%; animation-delay: 2s; }
        .emoji:nth-child(4) { left: 55%; animation-delay: 0.5s; }
        .emoji:nth-child(5) { left: 70%; animation-delay: 1.5s; }
        .emoji:nth-child(6) { left: 85%; animation-delay: 2.5s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(1.3);
                opacity: 0;
            }
        }

        /* 📱 Mobile tweaks */
        @media (max-width: 520px) {
            .container {
                padding: 28px 18px;
                width: 100%;
            }

            button {
                width: 100%;
                max-width: 340px;
                padding: 14px 18px;
            }

            .emoji {
                font-size: 26px;
            }

            .happy-gif {
                max-height: 190px;
            }
        }
    </style>
</head>

<body>

    <!-- 🎉 Floating Happy Emojis -->
    <div class="emoji">😍</div>
    <div class="emoji">💖</div>
    <div class="emoji">🎉</div>
    <div class="emoji">💝</div>
    <div class="emoji">💗</div>
    <div class="emoji">💞</div>

    <div class="container">
        <h1>Yay! You said YES! 💖🎉</h1>

        <img src="{% static 'happy.gif' %}" alt="Happy" class="happy-gif">

        <p>I am sooo happy 😍</p>
        <p>Please leave a note to make my day even brighter 💌</p>

        <form action="" method="POST">
            {% csrf_token %}
            <input type="text" name="note" placeholder="Your sweet note 💕">
            <button type="submit">Submit 💝</button>
        </form>
    </div>

</body>
</html>
