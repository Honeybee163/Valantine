{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Question</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            background-image: url("{% static 'pic7.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
        }

        /* 🌟 Floating Confused Emojis */
        .emoji {
            position: absolute;
            bottom: -50px;
            font-size: 35px;
            animation: floatUp 8s linear infinite;
            opacity: 0.85;
        }

        .emoji:nth-child(1) { left: 5%; animation-delay: 0s; }
        .emoji:nth-child(2) { left: 20%; animation-delay: 2s; }
        .emoji:nth-child(3) { left: 35%; animation-delay: 4s; }
        .emoji:nth-child(4) { left: 60%; animation-delay: 1s; }
        .emoji:nth-child(5) { left: 75%; animation-delay: 3s; }
        .emoji:nth-child(6) { left: 90%; animation-delay: 5s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 1; }
            100% {
                transform: translateY(-120vh) scale(1.3);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 220, 235, 0.66);
            padding: 45px 55px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.2);
            max-width: 550px;
            width: 90%;
            z-index: 2;
            border: 4px dotted white;
        }

        h1 {
            color: #b8325a;
            margin-bottom: 15px;
            font-size: clamp(22px, 5vw, 34px);
        }

        p {
            font-size: clamp(15px, 3.4vw, 18px);
            color: #7a2c45;
            margin-bottom: 15px;
        }

        /* 🎞️ THINKING GIF */
        .thinking-gif {
            max-width: 100%;
            max-height: 220px;
            height: auto;
            display: block;
            margin: 10px auto 20px;
            border-radius: 18px;
            object-fit: contain;
        }

        .options {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 35px;
            font-size: clamp(16px, 3.2vw, 18px);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            background: linear-gradient(to right, #ff6fae, #ff3d7f);
            box-shadow: 0 8px 20px rgba(255, 61, 127, 0.4);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #answer {
            display: none;
            margin-top: 25px;
            font-size: clamp(16px, 4vw, 22px);
            color: #c2185b;
            font-weight: bold;
        }

        #nextBtn {
            display: none;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            color: white;
        }

        /* 📱 Mobile tweaks */
        @media (max-width: 520px) {
            .container {
                padding: 28px 18px;
                width: 100%;
            }

            .options {
                gap: 12px;
            }

            button {
                width: 100%;
                max-width: 340px;
                padding: 14px 18px;
            }

            .emoji {
                font-size: 26px;
            }

            .thinking-gif {
                max-height: 170px;
            }
        }
    </style>
</head>

<body>

    <!-- 😕 Floating emojis -->
    <div class="emoji">🤔</div>
    <div class="emoji">😕</div>
    <div class="emoji">🤔</div>
    <div class="emoji">😕</div>
    <div class="emoji">🤔</div>
    <div class="emoji">😕</div>

    <div class="container">
        <h1>Before I reveal my secret 💌</h1>
        <p>Can you tell…</p>
        <h1>What’s my favourite color?</h1>

        <img src="{% static 'thinking.png' %}" alt="Thinking" class="thinking-gif">

        <div class="options">
            <button onclick="showAnswer()">Red</button>
            <button onclick="showAnswer()">Blue</button>
        </div>

        <p id="answer">Correct 💖 It’s Pink!</p>

        <button id="nextBtn">
            <a href="{% url 'describe' %}">Next ➡</a>
        </button>
    </div>

    <script>
        function showAnswer() {
            document.getElementById("answer").style.display = "block";
            document.getElementById("nextBtn").style.display = "inline-block";
        }
    </script>

</body>
</html>
