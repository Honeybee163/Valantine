{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secret</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            background-image: url("{% static 'pic7.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
        }

        .container {
            background: rgba(255, 230, 242, 0.9);
            padding: 50px 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            max-width: 550px;
            width: 90%;
            z-index: 2;
            border: 4px dotted white;
        }

        h1 {
            color: #b8325a;
            font-size: clamp(24px, 5.2vw, 36px);
            margin-bottom: 15px;
        }

        p {
            font-size: clamp(16px, 3.6vw, 22px);
            color: #7a2c45;
            margin-bottom: 20px;
        }

        /* 🎞️ GIFS */
        .question-gif,
        .crying-gif {
            max-width: 100%;
            max-height: 220px;
            height: auto;
            display: block;
            margin: 10px auto 20px;
            border-radius: 18px;
            object-fit: contain;
        }

        .crying-gif {
            display: none; /* hidden initially */
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 40px;
            font-size: clamp(16px, 3.2vw, 20px);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            background: linear-gradient(to right, #ff6fae, #ff3d7f);
            box-shadow: 0 10px 25px rgba(255, 61, 127, 0.45);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.1);
        }

        .reject {
            display: none;
            margin-top: 20px;
            font-size: 24px;
            color: #c2185b;
            font-weight: bold;
            animation: shake 0.4s infinite alternate;
        }

        @keyframes shake {
            from { transform: translateX(-5px); }
            to { transform: translateX(5px); }
        }

        /* 😰 Floating stressed emojis */
        .emoji {
            position: absolute;
            bottom: -50px;
            font-size: 35px;
            animation: floatUp 6s linear infinite;
            opacity: 0.9;
            display: none;
        }

        .emoji:nth-child(1) { left: 10%; animation-delay: 0s; }
        .emoji:nth-child(2) { left: 25%; animation-delay: 1s; }
        .emoji:nth-child(3) { left: 45%; animation-delay: 2s; }
        .emoji:nth-child(4) { left: 65%; animation-delay: 0.5s; }
        .emoji:nth-child(5) { left: 80%; animation-delay: 1.5s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 1; }
            100% {
                transform: translateY(-120vh) scale(1.3);
                opacity: 0;
            }
        }

        a {
            text-decoration: none;
            color: white;
        }

        /* 📱 Mobile tweaks */
        @media (max-width: 520px) {
            .container {
                padding: 28px 18px;
                width: 100%;
            }

            button {
                width: 100%;
                max-width: 340px;
                padding: 14px 18px;
            }

            .emoji { font-size: 26px; }

            .question-gif,
            .crying-gif {
                max-height: 180px;
            }
        }
    </style>
</head>

<body>

    <!-- 😰 Emojis floating on "No" -->
    <div class="emoji">😰</div>
    <div class="emoji">😰</div>
    <div class="emoji">😰</div>
    <div class="emoji">😰</div>
    <div class="emoji">😰</div>

    <div class="container">
        <h1>I really like you… 💖</h1>
        <p>Will you be my Valentine? 💌</p>

        <!-- Question GIF -->
        <img src="{% static 'question.gif' %}" alt="Question" class="question-gif">

        <!-- Crying GIF -->
        <img src="{% static 'crying.gif' %}" alt="Crying" class="crying-gif">

        <div class="options">
            <button><a href="{% url 'final' %}">Yes 😍</a></button>
            <button onclick="reject()">No 🙈</button>
        </div>

        <div class="reject">Pleaseee 😭💔</div>
    </div>

    <script>
        function reject() {
            // Hide question GIF
            document.querySelector('.question-gif').style.display = 'none';

            // Show crying GIF
            document.querySelector('.crying-gif').style.display = 'block';

            // Show shake text
            document.querySelector('.reject').style.display = 'block';

            // Show floating emojis
            let emojis = document.getElementsByClassName('emoji');
            for (let i = 0; i < emojis.length; i++) {
                emojis[i].style.display = 'block';
            }
        }
    </script>

</body>
</html>
